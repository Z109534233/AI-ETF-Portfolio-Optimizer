name: Methodology Autopilot Queue

# Manual, main-only entrypoint for the trusted sequential M1 -> M2 -> M3 -> M4
# methodology autopilot. It creates a unique temporary integration branch from
# the trusted main dispatch SHA, runs each task through automation/tasks/*.json
# using the reusable autopilot-task.yml pipeline (Claude initial implementation
# -> validate -> apply -> test -> PR -> up to 3 OpenAI review/fix rounds ->
# guarded merge into the integration branch), and - only after M4 reaches a
# merged PASS state - opens ONE cumulative PR from the integration branch to
# main. That cumulative PR is never auto-merged; it always ends in a human
# merge decision. See automation/AUTOPILOT_QUEUE.md for the full contract.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to confirm you want to start the M1->M4 autopilot queue from main'
        required: true
        type: string

concurrency:
  group: methodology-autopilot
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main_sha: ${{ steps.setup.outputs.main_sha }}
      integration_branch: ${{ steps.setup.outputs.integration_branch }}
    steps:
      - name: Require workflow_dispatch from main with explicit confirmation
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::The methodology autopilot queue may only be dispatched from main."
            exit 1
          fi
          if [ "${{ inputs.confirm }}" != "RUN" ]; then
            echo "::error::confirm input must be exactly RUN to start the queue."
            exit 1
          fi

      - name: Compute the trusted dispatch SHA and a unique integration branch name
        id: setup
        run: |
          echo "main_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "integration_branch=autopilot/${{ github.run_id }}/integration" >> "$GITHUB_OUTPUT"

  create_integration_branch:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the trusted main dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Create the unique temporary integration branch
        run: |
          git checkout -b "${{ needs.guard.outputs.integration_branch }}"
          git push origin "${{ needs.guard.outputs.integration_branch }}"

  m1:
    needs: [guard, create_integration_branch]
    uses: ./.github/workflows/autopilot-task.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      task_id: M1
      integration_branch: ${{ needs.guard.outputs.integration_branch }}
    secrets: inherit

  m2:
    needs: [guard, m1]
    if: needs.m1.outputs.status == 'merged'
    uses: ./.github/workflows/autopilot-task.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      task_id: M2
      integration_branch: ${{ needs.guard.outputs.integration_branch }}
    secrets: inherit

  m3:
    needs: [guard, m2]
    if: needs.m2.outputs.status == 'merged'
    uses: ./.github/workflows/autopilot-task.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      task_id: M3
      integration_branch: ${{ needs.guard.outputs.integration_branch }}
    secrets: inherit

  m4:
    needs: [guard, m3]
    if: needs.m3.outputs.status == 'merged'
    uses: ./.github/workflows/autopilot-task.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      task_id: M4
      integration_branch: ${{ needs.guard.outputs.integration_branch }}
    secrets: inherit

  create_cumulative_pr:
    needs: [guard, m4]
    if: needs.m4.outputs.status == 'merged'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      pr_number: ${{ steps.open_pr.outputs.pr_number }}
      base_sha: ${{ steps.open_pr.outputs.base_sha }}
      head_sha: ${{ steps.open_pr.outputs.head_sha }}
      pr_title: ${{ steps.open_pr.outputs.pr_title }}
      pr_body: ${{ steps.open_pr.outputs.pr_body }}
      allowed_files_json: ${{ steps.open_pr.outputs.allowed_files_json }}
      controller_comment_id: ${{ steps.open_pr.outputs.controller_comment_id }}
    steps:
      - name: Checkout trusted task specifications
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      # NOTE: this job only ever calls github.rest.pulls.create - it has no
      # merge action of any kind. Nothing in this workflow merges into main.
      - name: Open ONE cumulative PR from the integration branch to main (human merge required)
        id: open_pr
        uses: actions/github-script@v7
        env:
          INTEGRATION_BRANCH: ${{ needs.guard.outputs.integration_branch }}
          MAIN_SHA: ${{ needs.guard.outputs.main_sha }}
        with:
          script: |
            const fs = require('fs');
            const integrationBranch = process.env.INTEGRATION_BRANCH;
            const title = 'Methodology autopilot: M1-M4 cumulative changes';
            const queueMarker =
              `<!-- methodology-autopilot-managed:v1 run_id=${context.runId} task_id=CUMULATIVE -->`;

            const taskIds = ['M1', 'M2', 'M3', 'M4'];
            const cumulativeAllowed = new Set();
            for (const taskId of taskIds) {
              const spec = JSON.parse(
                fs.readFileSync(`automation/tasks/${taskId}.json`, 'utf8')
              );
              for (const path of (spec.allowed_files || [])) {
                cumulativeAllowed.add(path);
              }
            }

            const body = [
              queueMarker,
              '### Methodology autopilot cumulative PR (M1 -> M4)',
              '',
              `This PR cumulates all four methodology tasks completed on top of trusted main commit \`${process.env.MAIN_SHA}\`.`,
              'Each task (M1, M2, M3, M4) was independently implemented by Claude in a',
              'credential-isolated pattern, reviewed and repaired by OpenAI for up to 3',
              'rounds, tested with no AI secrets, and merged into the temporary',
              `integration branch \`${integrationBranch}\` only after a final PASS verdict.`,
              '',
              '**This PR may receive further OpenAI review/fix rounds, but it will',
              'NEVER be auto-merged. Merging into `main` requires an explicit human',
              'decision.**',
              '',
              'See `automation/AUTOPILOT_QUEUE.md` and `automation/tasks/*.json` for',
              'the full trusted task specifications and acceptance criteria.'
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              head: integrationBranch,
              base: 'main'
            });

            const marker = '<!-- openai-autofix-controller:v3 -->';
            const state = {
              attempts: 0,
              status: 'idle',
              last_repair_sha: '',
              last_run_id: '',
              autopilot_managed: true,
              autopilot_task: 'CUMULATIVE',
              autopilot_run_id: String(context.runId)
            };
            const commentBody = [
              marker,
              '<!-- openai-autofix-state:' + JSON.stringify(state) + ' -->',
              '## Auto-fix Controller',
              '',
              'Automatic repair attempts used: 0/3',
              'Status: idle.',
              'Trusted autopilot cumulative PR. Auto-fix may push repair commits to this',
              'branch, but nothing in this pipeline ever merges this PR into main.'
            ].join('\n');
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              body: commentBody
            });

            core.setOutput('pr_number', String(pr.data.number));
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('pr_title', title);
            core.setOutput('allowed_files_json', JSON.stringify([...cumulativeAllowed].sort()));
            core.setOutput('controller_comment_id', String(comment.data.id));

            const delimiter = 'EOF_BODY';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `pr_body<<${delimiter}\n${body}\n${delimiter}\n`);

            core.notice(
              'Cumulative PR opened against main. This workflow has no merge action for it; a human must review and merge it.'
            );

  cumulative_round_1:
    needs: [guard, create_cumulative_pr]
    uses: ./.github/workflows/openai-autofix-round.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      pr_number: ${{ fromJSON(needs.create_cumulative_pr.outputs.pr_number) }}
      base_sha: ${{ needs.create_cumulative_pr.outputs.base_sha }}
      head_sha: ${{ needs.create_cumulative_pr.outputs.head_sha }}
      head_ref: ${{ needs.guard.outputs.integration_branch }}
      pr_title: ${{ needs.create_cumulative_pr.outputs.pr_title }}
      pr_body: ${{ needs.create_cumulative_pr.outputs.pr_body }}
      controller_comment_id: ${{ needs.create_cumulative_pr.outputs.controller_comment_id }}
      attempt_count: 0
      autofix_allowed: true
      trusted_automation: true
      task_allowed_files_json: ${{ needs.create_cumulative_pr.outputs.allowed_files_json }}
    secrets: inherit

  cumulative_round_2:
    needs: [guard, create_cumulative_pr, cumulative_round_1]
    if: >
      needs.cumulative_round_1.result == 'success' &&
      needs.cumulative_round_1.outputs.verdict == 'FIX' &&
      needs.cumulative_round_1.outputs.status == 'completed' &&
      fromJSON(needs.cumulative_round_1.outputs.attempt_count) < 3
    uses: ./.github/workflows/openai-autofix-round.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      pr_number: ${{ fromJSON(needs.create_cumulative_pr.outputs.pr_number) }}
      base_sha: ${{ needs.create_cumulative_pr.outputs.base_sha }}
      head_sha: ${{ needs.cumulative_round_1.outputs.head_sha }}
      head_ref: ${{ needs.guard.outputs.integration_branch }}
      pr_title: ${{ needs.create_cumulative_pr.outputs.pr_title }}
      pr_body: ${{ needs.create_cumulative_pr.outputs.pr_body }}
      controller_comment_id: ${{ needs.create_cumulative_pr.outputs.controller_comment_id }}
      attempt_count: ${{ fromJSON(needs.cumulative_round_1.outputs.attempt_count) }}
      autofix_allowed: true
      trusted_automation: true
      task_allowed_files_json: ${{ needs.create_cumulative_pr.outputs.allowed_files_json }}
    secrets: inherit

  cumulative_round_3:
    needs: [guard, create_cumulative_pr, cumulative_round_2]
    if: >
      needs.cumulative_round_2.result == 'success' &&
      needs.cumulative_round_2.outputs.verdict == 'FIX' &&
      needs.cumulative_round_2.outputs.status == 'completed' &&
      fromJSON(needs.cumulative_round_2.outputs.attempt_count) < 3
    uses: ./.github/workflows/openai-autofix-round.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      pr_number: ${{ fromJSON(needs.create_cumulative_pr.outputs.pr_number) }}
      base_sha: ${{ needs.create_cumulative_pr.outputs.base_sha }}
      head_sha: ${{ needs.cumulative_round_2.outputs.head_sha }}
      head_ref: ${{ needs.guard.outputs.integration_branch }}
      pr_title: ${{ needs.create_cumulative_pr.outputs.pr_title }}
      pr_body: ${{ needs.create_cumulative_pr.outputs.pr_body }}
      controller_comment_id: ${{ needs.create_cumulative_pr.outputs.controller_comment_id }}
      attempt_count: ${{ fromJSON(needs.cumulative_round_2.outputs.attempt_count) }}
      autofix_allowed: true
      trusted_automation: true
      task_allowed_files_json: ${{ needs.create_cumulative_pr.outputs.allowed_files_json }}
    secrets: inherit
