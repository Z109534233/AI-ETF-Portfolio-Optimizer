        uses: actions/github-script@v7
        env:
          AFTER_SHA: ${{ steps.verify.outputs.after_sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '<!-- openai-autofix-controller:v1 -->',
                '## Auto-fix Controller',
                '',
                'Claude automatic repair round 3/3 updated the PR branch.',
                `New head: \`${process.env.AFTER_SHA}\``,
                'The same workflow run will now independently perform the final review.'
              ].join('\n'),
            });

      - name: Report blocker
        if: steps.verify.outputs.changed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '<!-- openai-autofix-controller:v1 -->',
                '## Auto-fix Controller',
                '',
                'STOP — Claude repair round 3/3 did not produce a new commit on the PR branch.',
                'Automatic repair has stopped to avoid repeated retries and unnecessary API usage.'
              ].join('\n'),
            });

      - name: Fail if Claude made no branch update
        if: steps.verify.outputs.changed != 'true'
        run: exit 1

  review_3:
    needs: repair_3
    if: needs.repair_3.result == 'success' && needs.repair_3.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout latest PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: pip install --upgrade openai

      - name: Compute latest PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA"
          git diff "$BASE_SHA" HEAD > pr.diff
          git diff --name-only "$BASE_SHA" HEAD > changed_files.txt

      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr_body.txt

      - name: Run final OpenAI reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python automation/reviewer.py \
            --pr-title "$PR_TITLE" \
            --pr-body-file pr_body.txt \
            --changed-files-file changed_files.txt \
            --diff-file pr.diff \
            --rules-file automation/REVIEW_RULES.md \
            --output-json review_result.json \
            --output-comment review_comment.md

      - name: Post or update final OpenAI review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            let body = fs.readFileSync('review_comment.md', 'utf8');

            if (result.verdict === 'FIX') {
              body += [
                '',
                '## Auto-fix Controller',
                '',
                'STOP — the maximum of 3 automatic Claude repair rounds has been reached.',
                'Human review is required before any further changes.'
              ].join('\n');
            }

            const marker = '## OpenAI Reviewer';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                (c.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
