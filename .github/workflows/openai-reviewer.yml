          CONTROLLER_ID: ${{ needs.controller.outputs.comment_id }}
          EXPECTED_COUNT: ${{ needs.repair_1.outputs.attempt_count }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        with:
          script: |
            const crypto = require('crypto');
            const marker = '<!-- openai-autofix-controller:v2 -->';
            const statePattern = /<!-- openai-autofix-state:(\{.*\}) -->/;
            const commentId = Number(process.env.CONTROLLER_ID);
            const expectedCount = Number(process.env.EXPECTED_COUNT);
            const response = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            const comment = response.data;
            if (!comment.user || comment.user.login !== 'github-actions[bot]' ||
                !(comment.body || '').includes(marker)) {
              core.setFailed('Trusted controller comment could not be verified.');
              return;
            }
            const match = (comment.body || '').match(statePattern);
            if (!match) {
              core.setFailed('Controller state marker is missing.');
              return;
            }
            const state = JSON.parse(match[1]);
            if (!Number.isInteger(state.attempts) || state.attempts < 0 || state.attempts > 3) {
              core.setFailed('Controller attempt count is invalid.');
              return;
            }
            if (state.attempts !== expectedCount) {
              core.setFailed('Stale controller state; refusing a concurrent repair.');
              return;
            }
            if (state.attempts >= 3) {
              core.setFailed('PR-level automatic repair cap is exhausted.');
              return;
            }
            const nextCount = state.attempts + 1;
            const nonce = crypto.randomBytes(24).toString('hex');
            state.attempts = nextCount;
            state.status = 'reserved';
            state.reserved_sha = process.env.BEFORE_SHA;
            state.last_nonce = nonce;
            const body = [
              marker,
              '<!-- openai-autofix-state:' + JSON.stringify(state) + ' -->',
              '## Auto-fix Controller',
              '',
              'Automatic repair attempts used: ' + nextCount + '/3',
              'Status: repair attempt ' + nextCount + ' is reserved and running.',
              'Reviewed head: ' + process.env.BEFORE_SHA
