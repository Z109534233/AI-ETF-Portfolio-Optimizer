  repair_2:
    needs: [controller, repair_1, review_1]
    if: needs.review_1.outputs.verdict == 'FIX' && needs.controller.outputs.autofix_allowed == 'true' && fromJSON(needs.repair_1.outputs.attempt_count) < 3
    runs-on: ubuntu-latest

    # The pinned Claude action uses OIDC to obtain its GitHub App token.
    # GITHUB_TOKEN itself remains read-only for repository contents.
